name: Deploy server

# The multiplayer server needs a host that can hold WebSockets open, which
# static hosting cannot. This puts it on Fly.
#
# It needs a FLY_API_TOKEN repository secret. Without it the job says so and
# stops, rather than failing the build.
#
# `fly tokens create deploy` is enough once the app exists; creating the app
# from here as well needs `fly tokens create org`. See the README.
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'fly.toml'
      - 'server/**'
      - 'core/**'
      - 'shared/**'
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fly:
    name: Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Is a Fly token configured?
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No FLY_API_TOKEN secret, so there is nothing to deploy to."
            echo "Add one with: fly tokens create deploy | gh secret set FLY_API_TOKEN"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.configured == 'true'

      # `flyctl deploy` needs the app to exist already — `fly launch` is what
      # normally creates it, and it is interactive. Create it here when it is
      # missing, so that minting a token is the only manual step.
      #
      # An app-scoped deploy token cannot create apps, so the very first deploy
      # needs either an org-scoped token or one local `fly apps create`. Saying
      # which beats failing with a bare "Could not find App".
      - name: Make sure the app exists
        if: steps.token.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)

          if flyctl status --app "$app" >/dev/null 2>&1; then
            echo "$app already exists"
            exit 0
          fi

          echo "$app does not exist yet, creating it in the $FLY_ORG org"
          flyctl apps create "$app" --org "$FLY_ORG" && exit 0

          echo "::error::Could not create the Fly app '$app'. See the log for what to do."
          echo "An app-scoped deploy token cannot create apps. Either create the app"
          echo "once, locally, and keep using the deploy token:"
          echo "    fly apps create $app"
          echo "or store an org-scoped token instead, which can:"
          echo "    fly tokens create org | gh secret set FLY_API_TOKEN"
          echo "App names are global on Fly: if '$app' is taken by somebody else, pick"
          echo "another one and change 'app' in fly.toml to match."
          exit 1

      # --remote-only builds on Fly's builders, so this needs no local Docker.
      - name: Deploy
        if: steps.token.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Check the deployed server is serving a game
        if: steps.token.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          url="https://$app.fly.dev"
          echo "checking $url"

          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null "$url/discover"; then break; fi
            sleep 2
          done

          body=$(curl -s "$url/discover")
          echo "  /discover: $body"
          echo "$body" | grep -q '"app":"spaceteam-lan"' || {
            echo "::error::$url is not answering as the game server"; exit 1; }
          echo "$body" | grep -q '"public":true' || {
            echo "::error::$url is not in public mode"; exit 1; }
          echo "::notice::Multiplayer is live at $url"
